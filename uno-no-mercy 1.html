<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd23f">
<title>UNO No Mercy — fan-made multiplayer card game</title>
<meta name="description" content="Play UNO Show 'Em No Mercy rules with friends: private rooms, invite links, voice chat, pass-and-play and AI. No sign-up, no server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1340;--mut:#6b5f8f;--pink:#ff3d8b;--yellow:#ffd23f;--cyan:#21d4fd;--lime:#7ae582;--orange:#ff8c42;--purple:#8b5cf6;
  --R:#ee1c25;--Y:#ffd400;--G:#1fa64a;--B:#0a6fd6;--W:#151515;
  --cw:78px;--pile:96px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#fff4d6;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(circle at 8% 12%,#ffc2dd 0 120px,transparent 121px),radial-gradient(circle at 94% 6%,#b8f2ff 0 150px,transparent 151px),
  radial-gradient(circle at 90% 88%,#fff08a 0 140px,transparent 141px),radial-gradient(circle at 4% 92%,#c9f7cf 0 110px,transparent 111px),
  radial-gradient(#ffd9a8 1.5px,transparent 1.5px) 0 0/22px 22px,#fff4d6;background-attachment:fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
#app{max-width:1100px;margin:0 auto;padding:16px 14px 110px;position:relative}
.narrow{max-width:560px;margin:0 auto}
.fd{font-family:'Fredoka',sans-serif}
h2.fd{font-size:28px;margin:6px 0 14px}

/* ---------- logo ---------- */
.logo{text-align:center;font-family:'Fredoka',sans-serif;font-weight:700;line-height:.95;margin:22px 0 6px}
.logo .l1{font-size:clamp(52px,17vw,96px);display:block}
.logo .l1 span{display:inline-block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);animation:hop 1.8s ease-in-out infinite}
.logo .l1 span:nth-child(1){color:var(--R)}.logo .l1 span:nth-child(2){color:var(--Y);animation-delay:.12s}.logo .l1 span:nth-child(3){color:var(--G);animation-delay:.24s}
.logo .l2{display:inline-block;margin-top:6px;font-size:clamp(24px,7vw,40px);color:#fff;background:var(--ink);padding:4px 18px;border-radius:14px;transform:rotate(-3deg);box-shadow:4px 4px 0 var(--pink)}
@keyframes hop{0%,60%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-10px) rotate(-6deg)}}
.tagline{text-align:center;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--mut);margin:16px 0 22px}
.fan{display:flex;justify-content:center;margin:8px 0 4px;height:130px}
.fan .card{--cw:70px;margin:0 -16px;transform-origin:50% 120%;animation:fanIn .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes fanIn{from{transform:translateY(60px) rotate(0) scale(.6);opacity:0}}
.madein{text-align:center;margin:22px auto 0;width:max-content;max-width:100%;font-family:'Fredoka',sans-serif;font-weight:700;font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:6px 16px;box-shadow:3px 3px 0 var(--pink);transform:rotate(-1.5deg)}

/* ---------- panels & buttons ---------- */
.card-ui{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:6px 6px 0 var(--ink)}
.card-ui.p{box-shadow:6px 6px 0 var(--pink),6px 6px 0 3px var(--ink)}
.card-ui.c{box-shadow:6px 6px 0 var(--cyan),6px 6px 0 3px var(--ink)}
.card-ui.y{box-shadow:6px 6px 0 var(--yellow),6px 6px 0 3px var(--ink)}
.label{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select{width:100%;background:#fffaf0;border:3px solid var(--ink);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;font-weight:700;outline:none}
input:focus,select:focus{box-shadow:4px 4px 0 var(--cyan)}
input[type=range]{padding:0;height:8px;accent-color:var(--pink);border-width:2px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
.btn{display:block;width:100%;padding:14px;border-radius:16px;border:3px solid var(--ink);background:var(--yellow);font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;text-align:center;touch-action:manipulation}
.btn:not(:disabled):hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn:not(:disabled):active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.w{background:#fff}.btn.p{background:var(--pink);color:#fff;text-shadow:2px 2px 0 var(--ink)}.btn.c{background:var(--cyan)}.btn.g{background:var(--lime)}.btn.o{background:var(--orange)}.btn.v{background:var(--purple);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:14px;border-width:2.5px;box-shadow:3px 3px 0 var(--ink);border-radius:12px}
.btn.xs{display:inline-block;width:auto;padding:3px 8px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 var(--ink);border-radius:9px}
.row{display:flex;gap:10px}.row>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:18px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.menu-grid .btn{padding:18px 10px;font-size:19px}
.menu-grid .btn .em{display:block;font-size:30px;margin-bottom:4px}
.err{color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center;margin:12px 0;font-weight:800}
.note{font-size:13px;color:var(--mut);font-weight:700}
.hr{font-size:10px;font-weight:900;background:var(--orange);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.06em;white-space:nowrap}
.off{font-size:10px;font-weight:900;background:var(--lime);border-radius:6px;padding:1px 6px;margin-left:6px;letter-spacing:.06em}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed #e6defa;font-weight:800;flex-wrap:wrap}
.setrow:last-child{border:none}
.setrow select{width:auto;min-width:150px;padding:8px 10px;font-size:14px}
.linkbox{font-size:13px;font-weight:700;word-break:break-all;color:var(--purple);border:3px dashed var(--purple);background:#f3edff;border-radius:14px;padding:10px}
.plist{list-style:none}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #e6defa;font-weight:800}
.plist li:last-child{border:none}
.plist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:38px;height:38px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:'Fredoka',sans-serif;font-size:17px;font-weight:700;color:var(--ink);text-transform:uppercase}
.tag{font-size:10px;background:#ffe9a8;border-radius:999px;padding:2px 8px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;font-weight:900;white-space:nowrap}
.tag.ok{background:var(--lime)}.tag.no{background:#ffd0dc}.tag.bot{background:#d9f6ff}
.x{background:#fff;border:2.5px solid var(--ink);border-radius:50%;width:30px;height:30px;font-weight:900;cursor:pointer;flex:none}
.summary{font-size:14px;line-height:1.7;font-weight:700}
.summary li{margin-left:18px}
.rules h3{font-family:'Fredoka',sans-serif;font-size:20px;margin:16px 0 6px}
.rules p,.rules li{font-size:15px;line-height:1.6}
.rules ul{padding-left:20px}
.rules table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.rules td,.rules th{border:2px solid var(--ink);padding:5px 8px;text-align:left}
.rules th{background:var(--yellow)}

/* ---------- PLAYING CARDS (original design, real-card proportions) ---------- */
.card{width:var(--cw);height:calc(var(--cw)*1.5);border-radius:calc(var(--cw)*.13);background:#fff;position:relative;flex:none;border:none;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.28);cursor:default;font-family:'Fredoka',sans-serif;user-select:none;-webkit-user-select:none;display:block;padding:0}
.card .f{position:absolute;inset:calc(var(--cw)*.065);border-radius:calc(var(--cw)*.09);background:var(--cc);overflow:hidden}
.card .f::before{content:"";position:absolute;left:50%;top:50%;width:70%;height:112%;border-radius:50%;background:#fff;transform:translate(-50%,-50%) rotate(32deg);box-shadow:0 0 0 calc(var(--cw)*.012) rgba(0,0,0,.08)}
.card .f::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,transparent 35%,transparent 70%,rgba(0,0,0,.12) 100%);pointer-events:none}
.card .mid{position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:var(--cc);font-weight:700;font-size:calc(var(--cw)*.6);line-height:1;
  -webkit-text-stroke:calc(var(--cw)*.025) #111;paint-order:stroke fill;text-shadow:calc(var(--cw)*.035) calc(var(--cw)*.035) 0 #111}
.card .mid.sm{font-size:calc(var(--cw)*.4)}
.card .mid svg{width:66%;height:auto;overflow:visible;filter:drop-shadow(calc(var(--cw)*.03) calc(var(--cw)*.03) 0 #111)}
.card .cn{position:absolute;z-index:2;color:#fff;font-weight:700;font-size:calc(var(--cw)*.2);line-height:1;-webkit-text-stroke:calc(var(--cw)*.014) #111;paint-order:stroke fill;text-shadow:1px 1px 0 #111;text-align:center}
.card .cn svg{width:calc(var(--cw)*.2);height:auto;filter:drop-shadow(1px 1px 0 #111)}
.card .tl{top:5%;left:9%}.card .br{bottom:5%;right:9%;transform:rotate(180deg)}
.card .pat{position:absolute;z-index:2;bottom:5%;left:9%;font-size:calc(var(--cw)*.13);color:#fff;text-shadow:0 0 2px #111,0 0 2px #111;line-height:1}
.card u{text-decoration:none;border-bottom:calc(var(--cw)*.04) solid #111}
.c-R{--cc:var(--R)}.c-Y{--cc:var(--Y)}.c-G{--cc:var(--G)}.c-B{--cc:var(--B)}.c-W{--cc:var(--W)}
.c-W .f::before{background:conic-gradient(from 32deg,var(--R) 0 25%,var(--B) 0 50%,var(--Y) 0 75%,var(--G) 0);border:calc(var(--cw)*.03) solid #fff}
.c-W .mid{color:#fff}
.c-W.k-roul .f::before{background:conic-gradient(from 0deg,var(--R),var(--Y),var(--G),var(--B),var(--R));animation:spin 6s linear infinite}
.card.back .f{background:#141414}
.card.back .f::before{background:var(--R);width:74%;height:104%}
.card.back .mid{color:var(--Y);font-size:calc(var(--cw)*.15);transform:rotate(-24deg);text-align:center;line-height:.95;-webkit-text-stroke:calc(var(--cw)*.018) #111;letter-spacing:.02em}
.card.mini{--cw:22px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.card.mini .mid{display:none}

/* hand */
.hand{display:flex;align-items:flex-end;overflow-x:auto;overflow-y:hidden;padding:30px 20px 14px 34px;min-height:calc(var(--cw)*1.5 + 50px);-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.hand::-webkit-scrollbar{height:8px}.hand::-webkit-scrollbar-thumb{background:rgba(0,0,0,.3);border-radius:9px}
.hand .card{margin-left:calc(var(--cw)*var(--ov,-.32));transition:transform .18s cubic-bezier(.34,1.56,.64,1),filter .2s,margin .2s;touch-action:pan-x}
.hand .card:first-child{margin-left:0}
.hand .card.legal{cursor:pointer;transform:translateY(-14px);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink),0 10px 18px rgba(0,0,0,.35)}
@media (hover:hover){.hand .card.legal:hover,.hand .card.legal:focus-visible{transform:translateY(-30px) scale(1.12);z-index:5;margin-right:calc(var(--cw)*.25)}.hand .card.dim:hover{transform:translateY(-6px);z-index:4}}
.hand .card.dim{filter:brightness(.62) saturate(.6)}
.hand .card.new{animation:dealIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes dealIn{from{transform:translate(-120px,-160px) rotate(-30deg) scale(.4);opacity:0}}
.hand.empty{justify-content:center;align-items:center;color:#fff;font-weight:900;font-size:15px;text-align:center}

/* ---------- table ---------- */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.topbar .code{font-family:'Fredoka',sans-serif;font-size:20px;background:var(--lime);border:3px solid var(--ink);border-radius:12px;padding:2px 10px;box-shadow:3px 3px 0 var(--ink);letter-spacing:.1em}
.topbar .sp{flex:1}
.board{background:radial-gradient(ellipse at 50% 38%,#3fe08a 0%,#16b862 45%,#0b8d48 100%);border:4px solid var(--ink);border-radius:34px;box-shadow:8px 8px 0 var(--ink),inset 0 0 0 10px rgba(255,255,255,.12),inset 0 0 60px rgba(0,0,0,.25);padding:14px 10px 6px;position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/8px 8px;pointer-events:none}
.seats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;position:relative;z-index:2}
.seat{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;min-width:150px;max-width:220px;box-shadow:4px 4px 0 rgba(0,0,0,.35);position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.seat.cur{background:#fff6c9;transform:translateY(-4px) scale(1.04);box-shadow:0 0 0 4px var(--yellow),4px 6px 0 4px rgba(0,0,0,.35);animation:glowSeat 1.2s ease-in-out infinite alternate}
@keyframes glowSeat{to{box-shadow:0 0 0 6px var(--pink),4px 6px 0 6px rgba(0,0,0,.35)}}
.seat.out{opacity:.55;filter:grayscale(1)}
.seat .info{min-width:0;flex:1}
.seat .nm{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ct{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900}
.seat .backs{display:flex}
.seat .backs .card{margin-left:-14px}.seat .backs .card:first-child{margin-left:0}
.seat .badge{position:absolute;top:-12px;right:-8px;font-size:11px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:2px 8px;background:var(--yellow);transform:rotate(6deg)}
.seat .badge.uno{background:var(--pink);color:#fff;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.seat .badge.dead{background:#222;color:#fff}
.seat .danger{color:var(--pink)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.center{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:clamp(18px,6vw,60px);padding:26px 0 18px}
.dirring{position:absolute;left:50%;top:50%;width:min(420px,92%);aspect-ratio:2.3;transform:translate(-50%,-50%);border:4px dashed rgba(255,255,255,.35);border-radius:50%;pointer-events:none}
.dirring .arr{position:absolute;inset:0;animation:spin 9s linear infinite}
.dirring.ccw .arr{animation-direction:reverse}
.dirring .arr::before,.dirring .arr::after{content:"➤";position:absolute;color:rgba(255,255,255,.75);font-size:24px}
.dirring .arr::before{top:-16px;left:50%}.dirring .arr::after{bottom:-16px;left:45%;transform:rotate(180deg)}
.dirring.flip{animation:flipDir .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes flipDir{50%{transform:translate(-50%,-50%) scale(1.15) rotateY(180deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .lbl{font-size:12px;font-weight:900;color:#fff;text-shadow:1px 1px 0 var(--ink);background:rgba(0,0,0,.25);border-radius:999px;padding:2px 10px;white-space:nowrap}
.drawpile{position:relative;background:none;border:none;cursor:default;--cw:var(--pile)}
.drawpile .card{position:relative}
.drawpile .card:nth-child(1){position:absolute;top:-6px;left:-6px}.drawpile .card:nth-child(2){position:absolute;top:-3px;left:-3px}
.drawpile.can{cursor:pointer;animation:nudge 1.1s ease-in-out infinite}
.drawpile.can .card:last-child{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--pink),0 6px 14px rgba(0,0,0,.4)}
@keyframes nudge{50%{transform:translateY(-6px) rotate(-2deg)}}
.discard{position:relative;--cw:calc(var(--pile) + 8px);width:var(--cw);height:calc(var(--cw)*1.5)}
.discard .card{position:absolute;inset:0}
.discard .ghost{transform:rotate(-12deg);filter:brightness(.8)}.discard .ghost2{transform:rotate(9deg);filter:brightness(.7)}
.discard .top.land{animation:land .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes land{from{transform:translateY(160px) rotate(40deg) scale(1.3);opacity:.2}}
.discard.drop{outline:4px dashed #fff;outline-offset:8px;border-radius:12px}
.colorring{position:absolute;inset:-12px;border-radius:20px;border:6px solid var(--cur,#fff);box-shadow:0 0 22px var(--cur,#fff);pointer-events:none;animation:ringPulse 1.6s ease-in-out infinite}
@keyframes ringPulse{50%{box-shadow:0 0 40px var(--cur,#fff)}}
.colorchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#fff;background:rgba(0,0,0,.28);border-radius:999px;padding:2px 10px 2px 4px;white-space:nowrap}
.colorchip i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:var(--cur)}
.stackbadge{position:absolute;right:-30px;top:-22px;z-index:4;background:var(--pink);color:#fff;font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700;border:3px solid var(--ink);border-radius:16px;padding:2px 10px;box-shadow:3px 3px 0 var(--ink);transform:rotate(10deg);animation:stackPulse .9s ease-in-out infinite alternate}
@keyframes stackPulse{to{transform:rotate(-6deg) scale(1.15)}}
.status{position:relative;z-index:2;text-align:center;margin:4px auto 6px;font-weight:900;font-size:15px;color:#fff;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);padding:0 6px}
.status .t{display:inline-block;background:var(--ink);color:var(--yellow);text-shadow:none;border-radius:999px;padding:1px 10px;margin-left:6px;font-size:13px}
.mercywarn{position:relative;z-index:2;margin:2px auto 6px;max-width:440px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:900;text-align:center;box-shadow:3px 3px 0 var(--pink);animation:wiggle 1.4s ease-in-out infinite}
.mercywarn.safe{box-shadow:3px 3px 0 var(--yellow);animation:none}
.me{position:relative;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:6px 0 2px}
.me .who{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 12px 4px 4px;font-weight:900}
.me .who.cur{background:var(--yellow);animation:glowSeat 1.2s ease-in-out infinite alternate}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.unobtn{background:var(--R);color:#fff;font-size:22px;text-shadow:2px 2px 0 var(--ink);animation:wiggle 1s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}}
.catchbtn{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;background:var(--pink)!important;color:#fff;animation:wiggle .8s infinite}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:980px){.layout.side{grid-template-columns:minmax(0,1fr) 290px}}
.sidepanel{max-height:70vh;display:flex;flex-direction:column}
.loglist{flex:1;overflow-y:auto;font-size:13px;font-weight:700;line-height:1.45;max-height:340px}
.loglist div{padding:3px 0;border-bottom:1px dashed #e6defa}

/* ---------- overlays ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(29,19,64,.55);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;animation:popin .35s cubic-bezier(.34,1.56,.64,1)}
.modal h3{font-family:'Fredoka',sans-serif;font-size:24px;margin-bottom:12px;text-align:center}
@keyframes popin{from{opacity:0;transform:translateY(30px) scale(.85) rotate(-3deg)}}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.colors button{height:90px;border-radius:18px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;color:#fff;text-shadow:2px 2px 0 var(--ink);transition:transform .15s}

<body>
<main id="app" aria-live="off"></main>
<div id="overlay"></div>
<div id="voiceAudio" hidden></div>
<div id="chatRoot" hidden></div>
<div id="vpanel" class="vpanel" role="dialog" aria-label="Voice chat" hidden></div>
<div id="reactLayer" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   NO MERCY — deterministic rules engine (no DOM, no network)
   Works in the browser (window.Engine) and in Node (module.exports).
   Rules: see RULES.md. Every state change goes through Engine.apply().
   ===================================================================== */
(function (root) {
  'use strict';

  const COLORS = ['R', 'Y', 'G', 'B'];
  const CNAME = { R: 'Red', Y: 'Yellow', G: 'Green', B: 'Blue', W: 'Wild' };
  const KNAME = {
    num: '', skip: 'Skip', rev: 'Reverse', d2: 'Draw 2', d4: 'Draw 4', skipAll: 'Skip Everyone',
    discAll: 'Discard All', wrd4: 'Wild Reverse Draw 4', wd6: 'Wild Draw 6', wd10: 'Wild Draw 10', roul: 'Wild Color Roulette'
  };
  const DRAW_VAL = { d2: 2, d4: 4, wrd4: 4, wd6: 6, wd10: 10 };
  const WILD_KINDS = ['wrd4', 'wd6', 'wd10', 'roul'];

  // Official defaults. Anything else is a labelled HOUSE RULE.
  const OFFICIAL_RULES = Object.freeze({
    handSize: 7,
    mercy: 25,               // eliminated at >= 25 cards (0 = off, house rule)
    stacking: true,          // draw cards stack with equal-or-higher value
    drawUntilPlayable: true, // no playable card -> draw until playable, then play it
    rouletteChooser: 'victim', // next player chooses the colour, then flips
    targetScore: 0           // 0 = single hand; 1000 = official optional scoring
  });

  /* ---------------- random ---------------- */
  function seededRng(seed) { // mulberry32 — deterministic, for tests/replays
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function secureRng() {
    const c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto : null;
    if (!c) return Math.random;
    const buf = new Uint32Array(1);
    return function () { c.getRandomValues(buf); return buf[0] / 4294967296; };
  }
  function shuffle(arr, rng) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    return arr;
  }

  /* ---------------- deck: 168 cards ---------------- */
  function buildDeck() {
    const d = []; let id = 0;
    const add = (c, k, n) => { const card = { id: id++, c, k }; if (n != null) card.n = n; d.push(card); };
    for (const c of COLORS) {
      for (let n = 0; n <= 9; n++) { add(c, 'num', n); add(c, 'num', n); } // 20
      for (let i = 0; i < 3; i++) add(c, 'skip');      // 3
      for (let i = 0; i < 3; i++) add(c, 'rev');       // 3
      for (let i = 0; i < 3; i++) add(c, 'd2');        // 3
      for (let i = 0; i < 2; i++) add(c, 'd4');        // 2
      for (let i = 0; i < 2; i++) add(c, 'skipAll');   // 2
      for (let i = 0; i < 3; i++) add(c, 'discAll');   // 3  -> 36 per colour
    }
    for (let i = 0; i < 8; i++) add('W', 'wrd4');
    for (let i = 0; i < 4; i++) add('W', 'wd6');
    for (let i = 0; i < 4; i++) add('W', 'wd10');
    for (let i = 0; i < 8; i++) add('W', 'roul');
    return d; // 144 + 24 = 168
  }

  const cardName = c => c.k === 'num' ? `${CNAME[c.c]} ${c.n}` : (c.c === 'W' ? KNAME[c.k] : `${CNAME[c.c]} ${KNAME[c.k]}`);
  const cardPoints = c => c.k === 'num' ? c.n : (c.c === 'W' ? 50 : 20);

  /* ---------------- helpers ---------------- */
  const activeIdx = s => s.players.map((p, i) => p.out ? -1 : i).filter(i => i >= 0);
  function nextFrom(s, i, steps) {
    const n = s.players.length; let j = i;
    for (let k = 0; k < (steps || 1); k++) {
      let g = 0;
      do { j = (j + s.dir + n) % n; } while (s.players[j].out && ++g <= n);
    }
    return j;
  }
  function ev(s, e) { e.seq = ++s.eseq; s.events.push(e); if (s.events.length > 40) s.events.shift(); }
  function log(s, msg) { s.log.push(msg); if (s.log.length > 60) s.log.shift(); }
  const nm = (s, i) => s.players[i].name;
  const top = s => s.discard[s.discard.length - 1];

  function ensureDraw(s) {
    if (s.draw.length) return true;
    const t = s.discard.pop();
    const pool = s.discard.concat(s.aside);
    s.discard = [t]; s.aside = [];
    if (!pool.length) return false;
    s.draw = shuffle(pool, s._rng);
    ev(s, { t: 'reshuffle', n: s.draw.length }); log(s, `Draw pile reshuffled (${s.draw.length} cards)`);
    return true;
  }
  function drawOne(s, p) {
    if (!ensureDraw(s)) return null;
    const c = s.draw.pop(); s.players[p].hand.push(c); return c;
  }
  function resetUno(pl) { pl.uno = false; pl.pre = false; pl.vuln = false; }

  function eliminate(s, p, why) {
    const pl = s.players[p];
    if (pl.out) return;
    const count = pl.hand.length;
    pl.out = true; s.aside.push(...pl.hand); pl.hand = []; resetUno(pl);
    s.knocked++;
    ev(s, { t: 'elim', p, count, why: why || '' });
    log(s, `💀 ${nm(s, p)} reached ${count} cards${why ? ' (' + why + ')' : ''} — ELIMINATED by the Mercy Rule (limit ${s.rules.mercy})`);
    const act = activeIdx(s);
    if (act.length === 1 && s.phase !== 'over') finish(s, act[0], 'last');
  }
  function checkMercy(s, p, why) {
    if (s.rules.mercy > 0 && !s.players[p].out && s.players[p].hand.length >= s.rules.mercy) { eliminate(s, p, why); return true; }
    return false;
  }
  function finish(s, w, reason) {
    s.phase = 'over'; s.winner = w; s.endReason = reason; s.stack = null; s.pending = null; s.mustPlay = null;
    let pts = 0;
    s.players.forEach((pl, i) => { if (i !== w) pl.hand.forEach(c => pts += cardPoints(c)); });
    pts += 250 * s.knocked;
    s.points = pts;
    ev(s, { t: 'win', p: w, reason, points: pts });
    log(s, reason === 'last' ? `🏆 ${nm(s, w)} is the last player standing!` : `🏆 ${nm(s, w)} played their last card and wins!`);
  }

  function isLegal(s, card) {
    if (s.stack) return !!(s.rules.stacking && DRAW_VAL[card.k] && DRAW_VAL[card.k] >= s.stack.last);
    if (card.c === 'W') return true;
    if (card.c === s.color) return true;
    const t = top(s);
    if (card.k === 'num') return t.k === 'num' && t.n === card.n;
    return card.k === t.k;
  }
  function legalIds(s, p) {
    if (s.phase !== 'play' || s.cur !== p || s.players[p].out) return [];
    if (s.mustPlay != null) return [s.mustPlay];
    return s.players[p].hand.filter(c => isLegal(s, c)).map(c => c.id);
  }

  function refreshUnoAfterSwap(s) {
    s.players.forEach(pl => { if (pl.out) return; pl.uno = false; pl.pre = false; pl.vuln = pl.hand.length === 1; });
  }
  function closeUnoWindows(s, actor) {
    s.players.forEach((pl, i) => { if (i !== actor) pl.vuln = false; });
  }

  /* ---------------- setup ---------------- */
  function createGame(opts) {
    const rules = Object.assign({}, OFFICIAL_RULES, opts.rules || {});
    const rng = opts.rng || secureRng();
    const n = opts.players.length;
    if (n < 2 || n > 6) throw new Error('2–6 players required');
    const s = {
      v: 1, tv: 1, eseq: 0, events: [], log: [],

/* =================== HOST (authoritative room) =================== */
function hostInit(mode, code) {
  H = {
    mode, code, hostId: token, seats: [], game: null, round: 0,
    settings: { rules: Object.assign({}, E.OFFICIAL_RULES), timer: 0, password: '' },
    chat: [], scores: {}, wins: {}, rematch: new Set(), lastResult: null,

}

  const g = H.game;

    code: H.code, mode: H.mode, hostId: H.hostId, round: H.round,
    seats: H.seats.map(s => ({ id: s.id, name: s.name, bot: s.bot, online: s.online, ready: s.ready, av: s.av, pid: s.pid || '', voice: !!s.voice, mic: !!s.mic })),
    settings: { rules: H.settings.rules, timer: H.settings.timer, hasPw: !!H.settings.password },
    chat: H.chat.slice(-50), inGame: !!g && g.phase !== 'over', gameOver: !!g && g.phase === 'over',
    scores: H.scores, wins: H.wins, rematch: [...H.rematch], lastResult: H.lastResult,
    timerLeft: H.deadline ? Math.max(0, H.deadline - Date.now()) : 0,

function hostBroadcast() {
  if (!H) return;
  const L = lobbyPublic();
  if (H.mode === 'local') {
    let viewer = -1; App.handoff = null;
    if (H.game) {
      const g = H.game;
      const actor = g.phase === 'roulette' ? g.pending.victim : g.cur;
      const allHumans = g.players.map((p, i) => p.bot ? -1 : i).filter(i => i >= 0);
      if (allHumans.length === 1) viewer = allHumans[0];
      else if (g.phase === 'over') viewer = -1;
      else if (!g.players[actor].bot) { if (App.localViewer === actor) viewer = actor; else App.handoff = actor; }
    }
    onLobby(L); if (H.game) onView(E.view(H.game, viewer)); else render();
    return;
  }
  H.seats.forEach(s => {
    if (s.bot) return;
    const msgV = H.game ? E.view(H.game, gameIdx(s.id)) : null;
    if (s.id === H.hostId) { onLobby(L); if (msgV) onView(msgV); else render(); return; }
    const c = H.conns[s.id];
    if (c && c.open) { try { c.send({ t: 'L', L }); if (msgV) c.send({ t: 'V', V: msgV }); } catch (e) { } }
  });
}

function hostTick() {
  if (!H || H.mode === 'local') return;
  const now = Date.now(); let ch = false;
  H.seats.forEach(s => { if (!s.bot && s.id !== H.hostId && s.online && now - (H.lastSeen[s.id] || 0) > 15000) { s.online = false; s.voice = false; s.mic = false; ch = true; sysChat(`${s.name} disconnected`); } });
  if (ch) { schedule(); hostBroadcast(); }
}

function hostStart() {
  const n = H.seats.length;
  if (n < 2 || n > 6) return toast('Need 2–6 players', true);
  if (H.mode !== 'local' && H.seats.some(s => !s.bot && !s.ready)) return toast('Waiting for everyone to be ready', true);
  if (H.settings.rules.targetScore && H.lastResult && H.lastResult.matchOver) { H.scores = {}; H.wins = {}; }
  H.seats.forEach(s => { if (H.scores[s.id] == null) H.scores[s.id] = 0; if (H.wins[s.id] == null) H.wins[s.id] = 0; });
  H.game = E.createGame({ players: H.seats.map(s => ({ id: s.id, name: s.name, bot: s.bot })), rules: H.settings.rules, rng: E.secureRng() });
  H.round++; H.rematch.clear(); H.lastResult = null; App.localViewer = -1;
  sysChat(`Round ${H.round} started`);

}

function hostAction(seatId, a) {
  if (!H.game) return { ok: false, error: 'No game running' };
  const idx = gameIdx(seatId);
  if (idx < 0) return { ok: false, error: 'You are watching this round' };
  const r = E.apply(H.game, idx, a);
  if (r.ok) afterChange();
  return r;
}

function afterChange() {
  const g = H.game;
  if (g && g.phase === 'over' && !H.lastResult) {
    const w = g.players[g.winner];
    H.scores[w.id] = (H.scores[w.id] || 0) + g.points; H.wins[w.id] = (H.wins[w.id] || 0) + 1;
    const target = g.rules.targetScore;
    H.lastResult = { winnerId: w.id, winner: w.name, reason: g.endReason, points: g.points, matchOver: !target || H.scores[w.id] >= target };
    clearTimeout(H.turnT); H.deadline = 0;
  }
  schedule();
  hostBroadcast();
}

  const g = H.game; if (!g || g.phase === 'over') return;
  const actor = g.phase === 'roulette' ? g.pending.victim : g.cur;
  const pl = g.players[actor], key = g.tv + ':' + actor + ':' + g.phase;
  if (pl.bot) H.botT = setTimeout(() => botMove(actor, key), (950 + rnd(600)) / SPEED);
  else {

    let ms = H.settings.timer ? H.settings.timer * 1000 : 0;
    if (H.mode !== 'local' && seat && !seat.online) ms = ms ? Math.min(ms, 8000) : 8000;
    if (ms) { H.deadline = Date.now() + ms; H.turnT = setTimeout(() => autoMove(actor, key), ms); }
  }

    if (!p.vuln) { delete H.catchT[i]; return; }

    if (!bots.length) return;
    const by = bots[rnd(bots.length)];

/* ---------- host networking ---------- */

}

    const id = String(m.token || '').slice(0, 40); if (!id || id === H.hostId) return;
    let s = seatById(id);

      if (H.settings.password && String(m.pw || '') !== H.settings.password) { try { conn.send({ t: 'err', msg: 'Wrong room password', fatal: true }); } catch (e) { } return; }
      if (H.seats.length >= 6) { try { conn.send({ t: 'err', msg: 'Room is full (6 players)', fatal: true }); } catch (e) { } return; }
      addSeat({ id, name: uniqueName(String(m.name || '').trim().slice(0, 14) || 'Player') });
      s = seatById(id); sysChat(`${s.name} joined`);
    } else if (!s.online) { sysChat(`${s.name} reconnected`); }
    s.online = true; s.pid = String(m.pid || '').slice(0, 80); s.voice = false; s.mic = false;
    const old = H.conns[id]; H.conns[id] = conn; conn._pid = id; H.lastSeen[id] = Date.now();

  }
  const id = conn._pid; if (!id || H.conns[id] !== conn) return;
  H.lastSeen[id] = Date.now();
  const s = seatById(id); if (!s) return;
  if (m.t === 'ping') { try { conn.send({ t: 'pong' }); } catch (e) { } if (!s.online) { s.online = true; hostBroadcast(); } return; }
  const now = Date.now(); const r = H.rate[id] = (H.rate[id] || []).filter(t => now - t < 2000); r.push(now); if (r.length > 14) return;
  hostCmd(id, m, conn);
}
function hostCmd(id, m, conn) {
  const s = seatById(id); if (!s) return;
  const reply = msg => { if (id === H.hostId || !conn) toast(msg, true); else try { conn.send({ t: 'err', msg }); } catch (e) { } };
  switch (m.t) {
    case 'act': {
      const seq = +m.seq || 0;
      if (id !== H.hostId && conn) { if (seq <= (H.seqs[id] || 0)) return; H.seqs[id] = seq; }
      const r = hostAction(id, m.a || {}); if (!r.ok) { reply(r.error); hostBroadcast(); } return;
    }
    case 'ready': if (!H.game || H.game.phase === 'over') { s.ready = !!m.v; hostBroadcast(); } return;
    case 'chat': {
      const text = String(m.text || '').replace(/\s+/g, ' ').trim().slice(0, 160); if (!text) return;
      const last = H.chat.filter(c => c.id === id).pop(); if (last && Date.now() - last.ts < 600) return;
      H.chat.push({ id, n: s.name, text, ts: Date.now() }); if (H.chat.length > 60) H.chat.shift(); hostBroadcast(); return;
    }
    case 'react': {

      const msg = { t: 'R', from: id, e };
      Object.values(H.conns).forEach(c => { if (c.open) try { c.send(msg); } catch (x) { } });
      onReact(msg); return;
    }

    case 'rematch': if (H.game && H.game.phase === 'over') { H.rematch.add(id); hostBroadcast(); } return;
  }
}

/* =================== CLIENT networking =================== */
function createRoom() {
  const name = getName(); if (!name) return;
  if (typeof Peer === 'undefined') return fail('Could not load the networking library (PeerJS). Check your internet and reload.');
  cleanup(); App.screen = 'connecting'; render();
  const code = genCode(); const peer = new Peer(PREFIX + code, PEER_OPTS); App.peer = peer;
  peer.on('open', () => {
    App.mode = 'host'; hostInit('online', code); addSeat({ id: token, name, pid: peer.id });
    history.replaceState(null, '', '?room=' + code); App.screen = 'lobby'; hostBroadcast();
  });
  peer.on('connection', hostOnConn);
  peer.on('call', c => Voice.onCall(c));
  peer.on('disconnected', () => { if (App.peer === peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch (e) { } }, 1500); });
  peer.on('error', e => { if (App.peer !== peer) return; if (e.type === 'unavailable-id') return createRoom(); if (!H) fail('Could not create room (' + e.type + ')'); else if (e.type !== 'peer-unavailable') toast('Network: ' + e.type, true); });
}
function joinRoom() {
  const name = getName(); if (!name) return;
  const code = (($('#code') && $('#code').value) || App.code || '').trim().toUpperCase();
  const pw = ($('#pw') && $('#pw').value) || App.pw || '';
  if (code.length < 4) return toast('Enter a room code', true);
  if (typeof Peer === 'undefined') return fail('Could not load the networking library (PeerJS). Check your internet and reload.');
  cleanup(); App.code = code; App.pw = pw; App.screen = 'connecting'; render();
  const peer = new Peer(PEER_OPTS); App.peer = peer;
  peer.on('call', c => Voice.onCall(c));
  const to = setTimeout(() => { if (App.peer === peer && App.screen === 'connecting') fail('Could not reach the room. Check the code — the host may have closed it, or your network blocks peer-to-peer.'); }, 20000);
  peer.on('open', () => {
    const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' }); App.conn = conn;
    conn.on('open', () => {
      clearTimeout(to); App.mode = 'client'; conn.send({ t: 'join', token, name, pw, pid: peer.id });
      App.lastSeen = Date.now(); history.replaceState(null, '', '?room=' + code);
      clearInterval(App.pingT);
      App.pingT = setInterval(() => { if (App.conn !== conn) return; if (conn.open) try { conn.send({ t: 'ping' }); } catch (e) { } if (Date.now() - App.lastSeen > 20000) lost(conn); }, 4000);
    });
    conn.on('data', d => { if (App.conn === conn) { App.lastSeen = Date.now(); clientMsg(d); } });
    conn.on('close', () => lost(conn)); conn.on('error', () => lost(conn));
  });
  peer.on('error', e => { if (App.peer !== peer) return; clearTimeout(to); if (e.type === 'peer-unavailable') fail(`Room ${code} not found. It may have ended — ask the host for a new link.`); else if (App.screen === 'connecting') fail('Connection error: ' + e.type); });
}
function clientMsg(m) {

  switch (m.t) {
    case 'L': onLobby(m.L); render(); break;
    case 'V': onView(m.V); break;
    case 'R': onReact(m); break;
    case 'err': if (m.fatal) fail(m.msg); else toast(m.msg, true); break;
    case 'kicked': cleanup(); goMenu('You were removed from the room.'); break;
    case 'closed': cleanup(); goMenu('The host closed the room.'); break;

}
function lost(conn) { if (conn && App.conn !== conn) return; if (App.mode !== 'client') return; clearInterval(App.pingT); Voice.stop(true); App.screen = 'lost'; render(); }
function cleanup() {
  clearInterval(App.pingT);
  if (H) { clearInterval(H.tickT); clearTimeout(H.botT); clearTimeout(H.turnT); Object.values(H.catchT).forEach(clearTimeout); }
  Voice.stop(true);
  const p = App.peer; App.peer = null; App.conn = null; H = null; App.mode = null;
  App.L = null; App.V = null; App.handoff = null; App.modal = null; App.lastEv = 0; App.evInit = false; App.known = new Set(); App.lastTop = null;
  App.chatOpen = false; App.logOpen = false; Chat.reset();

}
function goMenu(status) { history.replaceState(null, '', location.pathname); App.screen = 'menu'; App.status = status || ''; App.code = ''; render(); }

function leave() {

function send(m) {

  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) { } } }
  if ($('.hand')) $('.hand').scrollLeft = scrollHand;
  $('#overlay').innerHTML = overlays();
  Chat.update();
  Voice.refreshUI();
}
function view() {
  switch (App.screen) {
    case 'connecting': return `<div class="narrow" style="text-align:center"><div class="fan">${backHTML()}${backHTML()}${backHTML()}</div><h2 class="fd pulse">Connecting…</h2><p class="note">${App.code ? 'Room ' + esc(App.code) : 'Creating your room'}</p><button class="btn w mt2" data-a="menu">Cancel</button></div>`;

    case 'settings': return vSettings();
    case 'history': return vHistory();

  }
}

function rulesConfig(rules, timer, editable) {
  const dis = editable ? '' : 'disabled';
  const sel = (k, opts, cur) => `<select data-rule="${k}" ${dis}>${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return `<div class="setrow"><span>Mercy Rule ${rules.mercy !== 25 ? '<span class="hr">HOUSE RULE</span>' : '<span class="off">OFFICIAL</span>'}</span>${sel('mercy', [[25, 'Out at 25 cards'], [20, 'Out at 20'], [30, 'Out at 30'], [40, 'Out at 40'], [0, 'Off']], rules.mercy)}</div>
  <div class="setrow"><span>Stacking ${!rules.stacking ? '<span class="hr">HOUSE RULE</span>' : '<span class="off">OFFICIAL</span>'}</span>${sel('stacking', [[1, 'Equal or higher'], [0, 'No stacking']], rules.stacking ? 1 : 0)}</div>
  <div class="setrow"><span>No playable card ${!rules.drawUntilPlayable ? '<span class="hr">HOUSE RULE</span>' : '<span class="off">OFFICIAL</span>'}</span>${sel('drawUntilPlayable', [[1, 'Draw until playable'], [0, 'Draw one card']], rules.drawUntilPlayable ? 1 : 0)}</div>
  <div class="setrow"><span>Roulette colour ${rules.rouletteChooser !== 'victim' ? '<span class="hr">HOUSE RULE</span>' : '<span class="off">OFFICIAL</span>'}</span>${sel('rouletteChooser', [['victim', 'Next player picks'], ['player', 'Player who plays it']], rules.rouletteChooser)}</div>
  <div class="setrow"><span>Scoring</span>${sel('targetScore', [[0, 'Single hand'], [1000, 'First to 1000 pts']], rules.targetScore)}</div>
  <div class="setrow"><span>Turn timer</span>${sel('timer', [[0, 'Off'], [30, '30 seconds'], [60, '60 seconds']], timer)}</div>`;
}
function rulesSummary(r) {
  const li = (t, house) => `<li>${t}${house ? ' <span class="hr">HOUSE</span>' : ''}</li>`;
  return `<ul class="summary">${li('168-card deck, 7 cards each')}
  ${li(r.stacking ? 'Stack draw cards of equal or higher value' : 'No stacking — take every penalty', !r.stacking)}
  ${li(r.drawUntilPlayable ? 'No match? Draw until you can play, then play it' : 'No match? Draw one card', !r.drawUntilPlayable)}
  ${li(r.mercy ? `💀 Mercy Rule: hold ${r.mercy}+ cards and you're OUT (even mid-penalty)` : 'Mercy Rule off', r.mercy !== 25)}
  ${li('7 = swap hands · 0 = everyone passes hands')}
  ${li(r.rouletteChooser === 'victim' ? 'Roulette: next player picks a colour, flips until they hit it' : 'Roulette: the player who plays it picks the colour', r.rouletteChooser !== 'victim')}
  ${li('Forget UNO and get caught: +2')}
  ${li(r.targetScore ? 'Points: first to 1000 wins the match' : 'Single hand — first out (or last standing) wins')}</ul>`;
}
function setRule(k, v) {
  const target = H ? H.settings : App.setup;
  if (k === 'timer') target.timer = +v;
  else if (k === 'mercy' || k === 'targetScore') target.rules[k] = +v;
  else if (k === 'stacking' || k === 'drawUntilPlayable') target.rules[k] = v === '1';
  else if (k === 'rouletteChooser') target.rules[k] = v === 'player' ? 'player' : 'victim';
  if (H) hostBroadcast(); else render();
}

/* ---------- game table ---------- */
function vGame() {
  const V = App.V, L = App.L;
  if (!V || !L) return `<div class="narrow"><h2 class="fd pulse">Shuffling…</h2></div>`;
  const me = V.me, n = V.players.length;
  const order = []; if (me >= 0) { for (let k = 1; k < n; k++) order.push((me + k) % n); } else for (let k = 0; k < n; k++) order.push(k);
  const seatInfo = id => L.seats.find(s => s.id === id) || {};
  const actor = V.phase === 'roulette' && V.pending ? V.pending.victim : V.cur;
  const myP = me >= 0 ? V.players[me] : null;
  const top = V.top;
  const topCls = App.lastTop !== top.id ? 'land' : ''; App.lastTop = top.id;
  const hand = sortHand(V.hand);
  const newIds = App.known.size ? hand.filter(c => !App.known.has(c.id)).map(c => c.id) : [];
  App.known = new Set(hand.map(c => c.id));
  const myTurn = me >= 0 && V.cur === me && V.phase === 'play';
  const mercy = V.rules.mercy;
  const tleft = App.timerEnd ? Math.max(0, Math.ceil((App.timerEnd - Date.now()) / 1000)) : 0;

  let status;
  if (V.phase === 'over') status = `🏆 ${esc(V.players[V.winner].name)} wins!`;
  else if (V.phase === 'roulette') status = actor === me ? '🎰 Pick a colour for the roulette!' : `🎰 ${esc(V.players[actor].name)} is picking a roulette colour…`;
  else if (myTurn) status = V.stack ? (V.legal.length ? `Stack a +${V.stack.last} or higher — or take ${V.stack.total}` : `No card can stack on +${V.stack.last} — you must take ${V.stack.total}`) : V.mustPlay != null ? (V.canPass ? 'Play the drawn card or keep it' : 'Play the card you drew') : V.canDraw ? 'No match — draw until you can play' : 'Your turn — tap a highlighted card';
  else status = `${esc(V.players[V.cur].name)}'s turn${V.stack ? ` · facing +${V.stack.total}` : ''}`;

  // Mercy Rule warning before you take a penalty
  let warn = '';
  if (myTurn && V.stack && mercy && myP) {
    const after = myP.count + V.stack.total;
    if (after >= mercy) warn = `<div class="mercywarn">💀 Taking +${V.stack.total} puts you at <b>${after}</b> cards — the Mercy Rule knocks you out at ${mercy}! ${V.legal.length ? 'Stack a draw card to pass it on 👇' : 'No card can save you this time 😬'}</div>`;
    else if (after >= mercy - 5) warn = `<div class="mercywarn safe">⚠️ Taking +${V.stack.total} → ${after} cards (out at ${mercy})</div>`;
  } else if (myP && mercy && !myP.out && myP.count >= mercy - 5 && V.phase !== 'over') {
    warn = `<div class="mercywarn safe">⚠️ ${myP.count} cards — you're out at ${mercy}</div>`;
  }

  const seatHTML = i => {
    const p = V.players[i], si = seatInfo(p.id);
    const danger = mercy && p.count >= mercy - 5 && !p.out;
    const canCatch = p.vuln && !p.out && i !== me && (me < 0 ? App.mode === 'local' : !V.players[me].out);
    return `<div data-vid="${esc(p.id)}" class="seat ${i === actor && V.phase !== 'over' ? 'cur' : ''} ${p.out ? 'out' : ''}" aria-label="${esc(p.name)}, ${p.count} cards${p.out ? ', eliminated' : ''}">
      ${avatar(p.name, si.av ?? i)}<div class="info"><div class="nm">${esc(p.name)}${p.bot ? ' 🤖' : ''}${vIcon(si)}${si.online === false && !p.bot ? ' 📡' : ''}</div>
      <div class="ct ${danger ? 'danger' : ''}"><span class="backs">${Array.from({ length: Math.min(p.count, 6) }, () => backHTML('mini')).join('')}</span>${p.out ? '💀 out' : `${p.count}${mercy ? `<span style="opacity:.6">/${mercy}</span>` : ''}<span class="cw"> card${p.count === 1 ? '' : 's'}</span>${danger ? ' ⚠️' : ''}`}</div></div>
      ${p.out ? '<span class="badge dead">OUT</span>' : p.uno ? '<span class="badge uno">UNO!</span>' : ''}
      ${canCatch ? `<button class="btn xs catchbtn" data-a="catch" data-i="${i}">🚨 Catch!</button>` : ''}</div>`;
  };

  const side = App.logOpen;
  const ov = hand.length <= 4 ? -0.05 : hand.length <= 7 ? -0.25 : hand.length <= 12 ? -0.42 : -0.55;
  return `<div class="topbar"><span class="code">${App.mode === 'local' ? '📱 LOCAL' : esc(L.code)}</span><span class="note">Round ${L.round}</span>
    ${V.rules.targetScore ? `<span class="note">· to ${V.rules.targetScore} pts</span>` : ''}<span class="sp"></span>${vslot()}
    <button class="btn sm w" data-a="log" aria-pressed="${side}" aria-label="Game log">📜</button><button class="btn sm w" data-a="go" data-s="rules" data-back="1" aria-label="Rules">📖</button><button class="btn sm w" data-a="opensettings" aria-label="Settings">⚙️</button><button class="btn sm w" data-a="leave" aria-label="Leave">🚪</button></div>
  <div class="layout ${side ? 'side' : ''}"><div style="min-width:0">
  <div class="board">
    <div class="seats">${order.map(seatHTML).join('')}</div>
    <div class="center">
      <div class="dirring ${V.dir < 0 ? 'ccw' : ''}"><div class="arr"></div></div>
      <div class="pile"><button class="drawpile ${V.canDraw ? 'can' : ''}" data-a="${V.canDraw ? 'draw' : ''}" aria-label="Draw pile, ${V.drawCount} cards${V.canDraw ? ' — draw' : ''}">${backHTML()}${backHTML()}${backHTML()}</button><span class="lbl">${V.drawCount} left</span></div>
      <div class="pile"><div class="discard" data-drop="1" style="--cur:${CHEX[V.color] || '#fff'}">
        ${V.discardCount > 2 ? '<div class="card ghost2"></div>' : ''}${V.discardCount > 1 ? '<div class="card ghost"></div>' : ''}
        ${cardHTML(top, 'top ' + topCls)}<div class="colorring" style="--cur:${CHEX[V.color]}"></div>
        ${V.stack ? `<div class="stackbadge" aria-live="polite">+${V.stack.total}</div>` : ''}</div>
        <span class="colorchip" style="--cur:${CHEX[V.color]}"><i></i>${E.CNAME[V.color]} ${PAT[V.color]}</span></div>
    </div>
    <div class="status" aria-live="polite">${status}${tleft && V.phase !== 'over' ? `<span class="timer ${tleft <= 5 ? 'low' : ''}" id="tmr">${tleft}s</span>` : ''}</div>
    ${warn}
    ${myP ? `<div class="me"><div data-vid="${esc(App.mode === 'local' ? myP.id : token)}" class="who ${myTurn || (V.phase === 'roulette' && actor === me) ? 'cur' : ''}">${avatar(myP.name, (seatInfo(myP.id).av) ?? me, 30)}${esc(myP.name)} · ${myP.out ? '💀 out' : `${myP.count}${mercy ? `/${mercy}` : ''}`}${myP.uno ? ' · <span style="color:var(--pink)">UNO!</span>' : ''}</div>
      <div class="actions">
        ${V.canTake ? `<button class="btn sm p" data-a="take">Take +${V.stack.total}${mercy && myP.count + V.stack.total >= mercy ? ' 💀' : ''}</button>` : ''}
        ${V.canDraw ? `<button class="btn sm" data-a="draw">Draw 🂠</button>` : ''}
        ${V.canPass ? `<button class="btn sm w" data-a="pass">Keep & pass</button>` : ''}
        ${(V.canPreUno || (myP.vuln && myP.count === 1)) ? `<button class="btn sm unobtn" data-a="uno">UNO!</button>` : ''}
        ${V.preCalled ? '<span class="tag ok">UNO called ✓</span>' : ''}
      </div></div>` : `<div class="status" style="opacity:.85">${App.mode === 'local' && V.phase !== 'over' ? '🙈 Hands hidden' : 'Spectating — you’ll be dealt in next round'}</div>`}
    ${me >= 0 ? `<div class="hand ${hand.length ? '' : 'empty'}" style="--ov:${ov}" role="list" aria-label="Your hand">${hand.length ? hand.map(c => {
      const legal = V.legal.includes(c.id);
      return `<button class="card c-${c.c} k-${c.k} ${legal ? 'legal' : (myTurn ? 'dim' : '')} ${newIds.includes(c.id) ? 'new' : ''}" role="listitem" data-a="${legal ? 'card' : 'nope'}" data-id="${c.id}" ${legal ? 'draggable="true"' : ''} aria-label="${esc(E.cardName(c))}${legal ? ', playable' : ''}">${cardInner(c)}</button>`;
    }).join('') : (myP && myP.out ? 'You were eliminated — watch the carnage 🍿' : '')}</div>` : ''}
  </div>
  ${V.phase === 'over' ? vResults() : ''}
  </div>${side ? `<div class="card-ui sidepanel"><div class="label">Game log <button class="x" data-a="log">×</button></div><div class="loglist">${V.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join('')}</div></div>` : ''}</div>`;
}
function vResults() {
  const V = App.V, L = App.L, R = L.lastResult; if (!R) return '';
  const isHost = App.mode !== 'client';
  const rows = L.seats.filter(s => L.gameIds.includes(s.id)).map(s => ({ s, pts: L.scores[s.id] || 0, w: L.wins[s.id] || 0 })).sort((a, b) => b.pts - a.pts || b.w - a.w);
  const voted = L.rematch.includes(token);
  return `<div class="card-ui p mt2 results"><div class="big">${V.me === V.winner ? '🏆 YOU WIN!' : `🏆 ${esc(R.winner)} wins`}</div>
   <p style="text-align:center;font-weight:900" class="mt">${R.reason === 'last' ? 'Last player standing — everyone else got shown no mercy 💀' : 'Played their final card!'} · +${R.points} pts</p>
   ${V.rules.targetScore ? `<p class="note" style="text-align:center">${R.matchOver ? `🎉 Match over — ${esc(R.winner)} reached ${V.rules.targetScore}!` : `Playing to ${V.rules.targetScore} points`}</p>` : ''}
   <ul class="plist mt">${rows.map(r => `<li>${avatar(r.s.name, r.s.av)}<span class="nm">${esc(r.s.name)}${L.rematch.includes(r.s.id) ? '<span class="tag ok">rematch ✓</span>' : ''}</span><span class="note">${r.w} win${r.w === 1 ? '' : 's'}</span><span class="score">${r.pts}</span></li>`).join('')}</ul>
   <div class="row mt">${isHost ? `<button class="btn p" data-a="start">🔁 ${R.matchOver || !V.rules.targetScore ? 'Rematch' : 'Next hand'}</button><button class="btn w" data-a="tolobby">${App.mode === 'local' ? 'Setup' : 'Lobby'}</button>`
      : `<button class="btn ${voted ? 'w' : 'g'}" data-a="rematch" ${voted ? 'disabled' : ''}>${voted ? 'Voted ✓ waiting for host' : '🔁 Vote rematch'}</button>`}</div></div>`;
}

function overlays() {
  if (App.handoff != null && H && H.game) {
    const p = H.game.players[App.handoff];
    return `<div class="handoff" role="dialog" aria-label="Pass device"><div class="box"><div style="font-size:54px">🙈</div><div class="note">Pass the device to</div><div class="big">${esc(p.name)}</div>
      <p class="note">Everyone else, look away!</p><button class="btn p mt2" data-a="reveal">I'm ${esc(p.name)} — show my cards</button></div></div>`;
  }
  const M = App.modal, V = App.V;
  if (!M) return '';
  if ((M.type === 'color' || M.type === 'roulette') && V) {
    return `<div class="modal-bg peek"><div class="modal" role="dialog" aria-label="Choose a colour"><h3>${M.type === 'roulette' ? '🎰 Roulette! Pick a colour' : '🎨 Choose a colour'}</h3>
     ${M.type === 'roulette' ? '<p class="note" style="text-align:center;margin-bottom:12px">You will flip cards until you hit this colour — and keep them all.</p>' : ''}
     <div class="colors">${E.COLORS.map(c => `<button class="${c}" data-a="pickcolor" data-c="${c}">${PAT[c]} ${E.CNAME[c]}</button>`).join('')}</div>
     ${M.type === 'color' ? '<button class="btn w mt" data-a="cancel">Cancel</button>' : ''}
     <div class="peeknote">👇 Your cards are still visible below</div></div></div>`;
  }
  if (M.type === 'target' && V) {
    const opts = V.players.map((p, i) => ({ p, i })).filter(o => o.i !== V.me && !o.p.out);
    return `<div class="modal-bg"><div class="modal" role="dialog"><h3>🔄 Swap hands with…</h3><ul class="plist">${opts.map(o => `<li>${avatar(o.p.name, o.i)}<span class="nm">${esc(o.p.name)}</span><span class="tag">${o.p.count} cards</span><button class="btn sm p" data-a="picktarget" data-i="${o.i}">Swap</button></li>`).join('')}</ul><button class="btn w mt" data-a="cancel">Cancel</button></div></div>`;
  }
  if (M.type === 'settings') return `<div class="modal-bg"><div class="modal">${settingsBody()}<button class="btn mt" data-a="cancel">Done</button></div></div>`;
  return '';
}

function settingsBody() {
  return `<h3>⚙️ Settings</h3>
  <div class="setrow"><label for="s-sound">Sound effects</label><input type="checkbox" id="s-sound" data-pref="sound" ${prefs.sound ? 'checked' : ''}></div>
  <div class="setrow"><label for="s-sfx">Effects volume</label><input type="range" id="s-sfx" min="0" max="1" step="0.05" value="${prefs.sfx}" data-pref="sfx" style="width:150px"></div>
  <div class="setrow"><label for="s-music">Music volume</label><input type="range" id="s-music" min="0" max="1" step="0.05" value="${prefs.music}" data-pref="music" style="width:150px"></div>
  <div class="setrow"><label for="s-fx">Banners & confetti</label><input type="checkbox" id="s-fx" data-pref="effects" ${prefs.effects ? 'checked' : ''}></div>
  <div class="setrow"><label for="s-rm">Reduce motion</label><input type="checkbox" id="s-rm" data-pref="reduced" ${prefs.reduced ? 'checked' : ''}></div>
  <p class="note mt">Audio starts off until you enable it. Keyboard: D = draw / take · U = UNO · Tab + Enter to play cards.</p>`;
}
function vSettings() { return `<div class="narrow"><button class="btn sm w" data-a="menu">← Back</button><div class="card-ui mt">${settingsBody()}</div></div>`; }
function vHistory() {
  const list = JSON.parse(localStorage.getItem('nm_history') || '[]');
  return `<div class="narrow"><button class="btn sm w" data-a="menu">← Back</button><h2 class="fd">🏅 Match History</h2>
  ${list.length ? list.map(h => `<div class="card-ui ${h.me === 'won' ? 'y' : ''}"><div class="label">${new Date(h.ts).toLocaleString()} · ${h.mode}${h.me ? ` · <span style="color:${h.me === 'won' ? 'var(--G)' : 'var(--R)'}">you ${h.me}</span>` : ''}</div>
   <b>🏆 ${esc(h.winner)}</b> — ${h.reason === 'last' ? 'last standing' : 'emptied hand'} · +${h.points} pts<div class="note mt">${h.players.map(esc).join(' · ')}</div></div>`).join('') + '<button class="btn w" data-a="clearhist">Clear history</button>' : '<div class="card-ui">No matches yet — go deal some pain 😈</div>'}</div>`;
}
function vRules() {
  const ex = c => cardHTML(c, '', 'style="--cw:46px;display:inline-block;vertical-align:middle;margin-right:8px"');
  return `<div class="narrow"><button class="btn sm w" data-a="${App.rulesBack ? 'back' : 'menu'}">← Back</button><div class="card-ui mt rules"><h2 class="fd">📖 How to play No Mercy</h2>
  <p><b>Goal:</b> get rid of all your cards — or be the last player standing after everyone else is knocked out by the Mercy Rule.</p>
  <h3>Your turn</h3><ul><li>Match the top card by <b>colour, number or symbol</b>. Wild cards go on anything.</li><li>No match? <b>Draw until you get a playable card, then play it.</b></li><li>Down to one card? Hit <b>UNO!</b> (you can call it before you play your second-to-last card). If someone catches you before the next player starts, you draw 2.</li></ul>
  <h3>Stacking</h3><p>When a draw card hits you, you may stack any draw card of <b>equal or higher value</b> (colour doesn't matter). The penalty grows and moves on. Can't (or won't) stack? Take the whole pile and lose your turn.</p>
  <table><tr><th>On top</th><th>You may stack</th></tr><tr><td>+2</td><td>+2, +4, Wild Reverse +4, +6, +10</td></tr><tr><td>+4 / Wild Reverse +4</td><td>+4, Wild Reverse +4, +6, +10</td></tr><tr><td>+6</td><td>+6, +10</td></tr><tr><td>+10</td><td>+10</td></tr></table>
  <h3>Mercy Rule 💀</h3><p>The moment you hold <b>25 or more cards</b> you're out — even halfway through taking a penalty. Example: you hold 4 cards and take a +22 stack → you hit 25 → eliminated. The game warns you before you take it. Your cards are set aside and shuffled back in at the next reshuffle. (Hosts can change or switch off the limit as a house rule.)</p>
  <h3>The cards</h3>
  <p>${ex({ c: 'R', k: 'num', n: 7 })}<b>7 — Swap:</b> swap hands with a player of your choice.</p>
  <p>${ex({ c: 'B', k: 'num', n: 0 })}<b>0 — Pass:</b> everyone passes their hand to the next player in the direction of play.</p>
  <p>${ex({ c: 'G', k: 'skip' })}<b>Skip:</b> next player loses their turn.</p>
  <p>${ex({ c: 'Y', k: 'rev' })}<b>Reverse:</b> direction flips (with 2 players it works like Skip).</p>
  <p>${ex({ c: 'R', k: 'skipAll' })}<b>Skip Everyone:</b> everyone is skipped — you play again.</p>
  <p>${ex({ c: 'B', k: 'discAll' })}<b>Discard All:</b> also discard every card of that colour in your hand.</p>
  <p>${ex({ c: 'G', k: 'd2' })}${ex({ c: 'Y', k: 'd4' })}<b>Draw 2 / Draw 4:</b> next player draws and loses their turn (stackable).</p>
  <p>${ex({ c: 'W', k: 'wrd4' })}<b>Wild Reverse Draw 4:</b> reverse direction, then the new next player draws 4. You choose the colour.</p>
  <p>${ex({ c: 'W', k: 'wd6' })}${ex({ c: 'W', k: 'wd10' })}<b>Wild Draw 6 / 10:</b> next player draws 6 / 10 and loses their turn. You choose the colour.</p>
  <p>${ex({ c: 'W', k: 'roul' })}<b>Wild Color Roulette:</b> the next player picks a colour, then flips cards until they reveal it — and keeps them all. They lose their turn.</p>
  <h3>Voice chat 🎧</h3><p>Tap <b>🎧 Join voice</b> to listen — no microphone needed. Only you decide when to talk: tap <b>🔇 Off / 🎙️ On</b>, or open <b>👥</b> and hold <b>✋ Hold to talk</b>. In 👥 you can also mute or turn down any player just for yourself.</p>
  <h3>Scoring (optional)</h3><p>Winner scores opponents' cards: numbers = face value, colour actions = 20, wilds = 50, plus 250 per player knocked out. First to 1000 wins.</p></div></div>`;
}

/* =================== interactions =================== */
function onCard(id) {
  const V = App.V; if (!V) return;
  const c = V.hand.find(x => x.id === id); if (!c || !V.legal.includes(id)) return;
  const needColor = c.c === 'W' && !(c.k === 'roul' && V.rules.rouletteChooser === 'victim');
  const willHave = V.hand.length - 1 - (c.k === 'discAll' ? V.hand.filter(x => x.id !== id && x.c === c.c).length : 0);
  const needTarget = c.k === 'num' && c.n === 7 && willHave > 0;
  App.modal = { type: null, tv: V.tv, card: id, color: null, target: null, needColor, needTarget };
  advanceChoice();
}
function advanceChoice() {
  const M = App.modal;
  if (M.needColor && !M.color) { M.type = 'color'; return render(); }
  if (M.needTarget && M.target == null) { M.type = 'target'; return render(); }
  const a = { t: 'play', id: M.card }; if (M.color) a.color = M.color; if (M.target != null) a.target = M.target;
  App.modal = null; render(); act(a);
}
const actions = {
  go: el => { App.status = ''; App.rulesBack = !!el.dataset.back; App.prevScreen = App.screen; App.screen = el.dataset.s; render(); },
  back: () => { App.screen = App.prevScreen || 'game'; App.rulesBack = false; render(); },
  menu: () => {
    if (App.mode) { if (!confirm('Leave the current game?')) return; leave(); return; }
    if (App.peer) cleanup();
    App.status = ''; history.replaceState(null, '', location.pathname); App.code = ''; App.screen = 'menu'; render();
  },
  create: createRoom, join: joinRoom,
  leave: () => { if (confirm(App.mode === 'host' ? 'Leave and close the room for everyone?' : 'Leave this game?')) leave(); },
  copy: () => { const link = roomLink(App.L.code); (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('🔗 Link copied — send it to your friends')).catch(() => prompt('Copy this link:', link)); },
  share: () => navigator.share({ title: 'UNO No Mercy', text: 'Join my No Mercy room! 😈🃏', url: roomLink(App.L.code) }).catch(() => { }),
  quickai: () => { App.setup = { players: [{ name: prefs.name || 'You', bot: null }, { name: 'Chip', bot: 'medium' }, { name: 'Robo Raja', bot: 'medium' }, { name: 'Nova', bot: 'hard' }], rules: Object.assign({}, E.OFFICIAL_RULES), timer: 0 }; App.screen = 'localsetup'; render(); },
  ladd: () => { App.setup.players.push({ name: 'Player ' + (App.setup.players.length + 1), bot: null }); render(); },
  laddbot: () => { const lvl = $('#lbot').value; const used = App.setup.players.map(p => p.name); App.setup.players.push({ name: BOT_NAMES.find(b => !used.includes(b)) || 'Bot', bot: lvl }); render(); },
  lrm: el => { App.setup.players.splice(+el.dataset.i, 1); render(); },
  lstart: () => {
    document.querySelectorAll('[data-pname]').forEach(i => { App.setup.players[+i.dataset.pname].name = i.value.trim().slice(0, 14) || 'Player ' + (+i.dataset.pname + 1); });
    const S = App.setup; if (S.players.length < 2) return toast('Need 2+ players', true);
    if (S.players[0] && !S.players[0].bot) { prefs.name = S.players[0].name; savePrefs(); }
    cleanup(); App.mode = 'local'; hostInit('local', 'LOCAL');
    H.settings.rules = Object.assign({}, S.rules); H.settings.timer = S.timer;
    S.players.forEach((p, i) => addSeat({ id: 'L' + i + '_' + Date.now().toString(36), name: p.name, bot: p.bot }));
    Snd.init(); Snd.music(true); hostStart();
  },
  addbot: () => { const lvl = $('#obot').value; const used = H.seats.map(s => s.name); addSeat({ id: 'bot' + Date.now().toString(36) + rnd(999), name: BOT_NAMES.find(b => !used.includes(b)) || 'Bot', bot: lvl }); hostBroadcast(); },
  kick: el => {
    const s = seatById(el.dataset.id); if (!s || !confirm('Remove ' + s.name + '?')) return;
    if (H.game && H.game.phase !== 'over' && gameIdx(s.id) >= 0) return toast('Can’t remove a player mid-hand — they’ll be auto-played if offline', true);
    H.seats = H.seats.filter(x => x !== s); const c = H.conns[s.id];
    if (c) { try { c.send({ t: 'kicked' }); } catch (e) { } setTimeout(() => { try { c.close(); } catch (e) { } }, 300); delete H.conns[s.id]; }
    sysChat(`${s.name} was removed`); hostBroadcast();
  },
  ready: () => { const me = App.L.seats.find(s => s.id === token); send({ t: 'ready', v: !(me && me.ready) }); },
  start: () => { Snd.init(); Snd.music(true); hostStart(); },
  tolobby: () => {
    if (App.mode === 'local') { const r = H.settings.rules, t = H.settings.timer; leave(); App.setup.rules = r; App.setup.timer = t; App.screen = 'localsetup'; render(); return; }
    H.game = null; H.lastResult = null; H.seats.forEach(s => { if (!s.bot && s.id !== H.hostId) s.ready = false; }); App.screen = 'lobby'; App.V = null; hostBroadcast();
  },
  rematch: () => send({ t: 'rematch' }),
  card: el => onCard(+el.dataset.id),
  nope: () => { const V = App.V; if (!V) return; if (V.me >= 0 && V.cur === V.me && V.phase === 'play') toast(V.stack ? `Only +${V.stack.last} or higher can stack` : V.mustPlay != null ? 'Play the card you drew' : 'That card doesn’t match', true); },
  pickcolor: el => { const M = App.modal; if (!M) return; if (M.type === 'roulette') { App.modal = null; render(); act({ t: 'roul', color: el.dataset.c }); return; } M.color = el.dataset.c; advanceChoice(); },
  picktarget: el => { App.modal.target = +el.dataset.i; advanceChoice(); },
  cancel: () => { App.modal = null; render(); },
  draw: () => act({ t: 'draw' }), take: () => act({ t: 'take' }), pass: () => act({ t: 'pass' }),
  uno: () => act({ t: 'uno' }),
  catch: el => act({ t: 'catch', target: +el.dataset.i }),
  reveal: () => { App.localViewer = App.handoff; App.handoff = null; hostBroadcast(); },
  log: () => { App.logOpen = !App.logOpen; render(); },
  opensettings: () => { App.modal = { type: 'settings' }; render(); },
  clearhist: () => { if (confirm('Clear match history?')) { localStorage.removeItem('nm_history'); render(); } }
};

/* voice controls (outside #app re-render) */
const vActions = {
  join: () => Voice.start(),
  mic: () => Voice.toggleMic(),
  panel: () => { Voice.panelOpen = !Voice.panelOpen; Voice.renderPanel(true); },
  close: () => { Voice.panelOpen = false; Voice.renderPanel(); },
  leave: () => Voice.stop()
};
document.addEventListener('click', e => {
  Object.values(Voice.audios).forEach(a => { if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => { }); } });
  const v = e.target.closest('[data-v]'); if (v && v.dataset.v !== 'ptt') { vActions[v.dataset.v] && vActions[v.dataset.v](); return; }
  const vm = e.target.closest('[data-vmute]');
  if (vm) { const id = vm.dataset.vmute; Voice.vmuted.has(id) ? Voice.vmuted.delete(id) : Voice.vmuted.add(id); Voice.applyAudio(id); Voice.renderPanel(true); return; }
  const el = e.target.closest('#app [data-a], #overlay [data-a]');
  if (el && !el.disabled && actions[el.dataset.a]) { Snd.init(); actions[el.dataset.a](el); }
});
// hold-to-talk (pointer + keyboard space on the button)
document.addEventListener('pointerdown', e => { const b = e.target.closest('[data-v="ptt"]'); if (!b || Voice.micOn) return; e.preventDefault(); Voice.ptt = true; Voice.setMic(true); });
const pttUp = () => { if (Voice.ptt) { Voice.ptt = false; Voice.setMic(false); } };
document.addEventListener('pointerup', pttUp); document.addEventListener('pointercancel', pttUp);
document.addEventListener('input', e => {
  if (e.target.id === 'code') e.target.value = e.target.value.toUpperCase();
  if (e.target.dataset && e.target.dataset.vvol) { const id = e.target.dataset.vvol; Voice.vol[id] = +e.target.value; Voice.applyAudio(id); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rule) setRule(t.dataset.rule, t.value);
  if (t.dataset.pref) { const k = t.dataset.pref; prefs[k] = t.type === 'checkbox' ? t.checked : +t.value; savePrefs(); applyMotion(); if (k === 'sound' && prefs.sound) { Snd.init(); Snd.play('uno'); } if (k === 'sound' || k === 'music') Snd.music(!!App.mode); render(); }
  if (t.id === 'pwset' && H) { H.settings.password = t.value.trim().slice(0, 24); hostBroadcast(); }
  if (t.dataset.pname != null) App.setup.players[+t.dataset.pname].name = t.value.trim().slice(0, 14) || App.setup.players[+t.dataset.pname].name;
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('#chatRoot, #vpanel')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    if (e.key === 'Enter' && e.target.id === 'name') { if (App.screen === 'join') joinRoom(); else if (App.screen === 'online') createRoom(); }
    if (e.key === 'Enter' && (e.target.id === 'code' || e.target.id === 'pw')) joinRoom();
    return;
  }
  const V = App.V; if (App.screen !== 'game' || !V) return;
  if (e.key === 'Escape' && App.modal && App.modal.type !== 'roulette') { App.modal = null; render(); }
  if (e.key === 'd' || e.key === 'D') { if (V.canTake) act({ t: 'take' }); else if (V.canDraw) act({ t: 'draw' }); }
  if (e.key === 'u' || e.key === 'U') act({ t: 'uno' });
});
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card.legal'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.id); const d = $('.discard'); if (d) d.classList.add('drop'); } });
document.addEventListener('dragend', () => { const d = $('.discard'); if (d) d.classList.remove('drop'); });
document.addEventListener('dragover', e => { if (e.target.closest && e.target.closest('[data-drop]')) e.preventDefault(); });
document.addEventListener('drop', e => { if (e.target.closest && e.target.closest('[data-drop]')) { e.preventDefault(); const id = +e.dataTransfer.getData('text/plain'); if (!isNaN(id)) onCard(id); } });
window.addEventListener('beforeunload', e => { if (App.mode === 'host' && H && H.seats.some(s => !s.bot && s.id !== token)) { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { const t = $('#tmr'); if (t && App.timerEnd) { const s = Math.max(0, Math.ceil((App.timerEnd - Date.now()) / 1000)); t.textContent = s + 's'; t.classList.toggle('low', s <= 5); } }, 250);

applyMotion();
render();

</script>
</body>
</html>
